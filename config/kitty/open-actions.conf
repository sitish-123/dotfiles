# Loaded automatically by kitty. First matching block wins.

# file:// link with a line-number fragment -> VS Code at that line
protocol file
fragment_matches ^\d+(:\d+)?$
action launch --type=background code --goto ${FILE_PATH}:${FRAGMENT}

# directory
protocol file
mime inode/directory
action launch --type=background code ${FILE_PATH}

# any text/source file -> VS Code
protocol file
mime text/*
action launch --type=background code --goto ${FILE_PATH}

# non-text (pdf, images, ...) -> OS default
protocol file
action launch --type=background xdg-open ${FILE_PATH}
