# ═══════════════════════════════════════════════════════════════════════════
# Kitty
# ═══════════════════════════════════════════════════════════════════════════
# Ricelin's ghostty look ported onto kitty, with the useful bits of the
# previous setup's kitty.conf (cursor trail, font-size binds, search kitten)
# kept. Colours are not here: wallcolors.py rewrites kitty-colors.conf on
# every wallpaper change and signals kitty to reload, the same way it feeds
# ghostty-colors to ghostty.
# ═══════════════════════════════════════════════════════════════════════════

# ── Font ───────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        12.0
# ghostty's adjust-cell-height = 8%
modify_font      cell_height 8%

# ── Window ─────────────────────────────────────────────────────────────────
# ghostty window-padding-x 14 / -y 12; kitty takes vertical then horizontal.
window_padding_width      12 14
hide_window_decorations   yes
confirm_os_window_close   0
background_opacity        0.85
# Lets `kitty @ set-background-opacity` work at runtime, and is required for
# opacity changes to apply without a restart.
dynamic_background_opacity yes

# ── Cursor ─────────────────────────────────────────────────────────────────
cursor_shape           block
cursor_blink_interval  0
cursor_trail           1
mouse_hide_wait        3.0

# ── Clipboard ──────────────────────────────────────────────────────────────
# Matches ghostty's copy-on-select = clipboard.
copy_on_select clipboard

# ctrl+v is deliberately NOT bound. Binding it makes the terminal swallow the
# keypress and paste the clipboard as text, which breaks pasting images into
# TUIs that read the clipboard themselves (Claude Code). Paste lives on
# ctrl+shift+v instead.
map ctrl+shift+v paste_from_clipboard
map ctrl+c       copy_or_interrupt

# ── Font size ──────────────────────────────────────────────────────────────
map ctrl+plus        change_font_size all +1
map ctrl+equal       change_font_size all +1
map ctrl+kp_add      change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore  change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

# ── Scroll ─────────────────────────────────────────────────────────────────
map page_up   scroll_page_up
map page_down scroll_page_down

# ── Search scrollback ──────────────────────────────────────────────────────
# kitty's built-in scrollback search (in-buffer, vim-style / search).
# Default is ctrl+shift+/; bind it to ctrl+shift+f AND ctrl+f so it matches
# terminal/ghostty muscle memory. Ctrl+Shift+F is NOT search by default
# in kitty (it's window move), which is why it seemed to do nothing.
map ctrl+shift+f search_scrollback
map ctrl+f        search_scrollback

# ── File links ─────────────────────────────────────────────────────────────
# Clicking `lib/foo.dart:42` in Claude Code did nothing because kitty only
# treats OSC-8 hyperlinks and scheme-prefixed URLs as clickable — a bare
# path:line is plain text. And real file:// links fell through to xdg-open →
# gedit (the text/plain default), which ignores the line number.
#   * ~/.config/kitty/open-actions.conf now routes file:// → `code --goto`.
#   * ctrl+shift+o hint-picks any path:line on screen for plain-text refs.
editor      code
detect_urls yes
map ctrl+shift+o kitten hints --type linenum --linenum-action=background code --goto {path}:{line}

# ctrl+click a `path:line` to open it -- a real single click, no letter press.
# kitty can't turn plain text into a link (detect_urls/url_prefixes both need a
# `://` scheme and there is no user-definable link regex), so instead of
# linkifying we select the token under the cursor and hand it to a script.
# `upto_surrounding_whitespace` grabs the whole whitespace-delimited token, so
# the `:42` comes along without having to add `:` to select_by_word_characters
# and change how double-click behaves everywhere else.
# --cwd=current makes the script's $PWD the clicked window's cwd, so relative
# paths resolve; @selection is substituted with the text just selected.
# NB: absolute path, not ${HOME} -- kitty expands env vars in `include` lines
# but NOT in action arguments, so ${HOME} would reach launch as a literal.
mouse_map ctrl+left press ungrabbed combine : mouse_selection upto_surrounding_whitespace : launch --type=background --cwd=current /home/sitish/.config/kitty/open-file-ref.sh @selection

# ── Colours ────────────────────────────────────────────────────────────────
# Regenerated by ~/.config/hypr/scripts/wallcolors.py on every wallpaper
# change; kitty reloads it on SIGUSR1, which that script sends.
include ${HOME}/.cache/ricelin/kitty-colors.conf
